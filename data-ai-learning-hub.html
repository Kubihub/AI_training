/* Layout: sticky module index on the left, one centred reading column; on phones the index slides in as a drawer.
   Single light theme by brand choice: Youth in AI violet on pure white. */
:root {
  --brand: #6D28D9;   /* Youth in AI violet */
  --tint: #EEF2FF;    /* soft violet/indigo tint */
  --bg: #FFFFFF;      /* base background */
  --ink: #0F172A;     /* slate 900 text */
  --line: #E2E8F0;    /* slate 200 borders */
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 1024px) { .gutter { padding-left: max(48px, env(safe-area-inset-left, 0px)); padding-right: max(48px, env(safe-area-inset-right, 0px)); } }
.side-sticky { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; }
.drawer { padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); }
.hero-dots { background-image: radial-gradient(rgba(255,255,255,0.16) 1px, transparent 1px); background-size: 18px 18px; }
.tabular { font-variant-numeric: tabular-nums; }
.sticky-top { position: sticky; top: env(safe-area-inset-top, 0px); }
@media (min-width: 640px) { .sticky-sm { position: sticky; top: env(safe-area-inset-top, 0px); } }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.no-scrollbar { scrollbar-width: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

  summary: "What the digital economy is, why AI matters for Africa, how data analytics, machine learning and AI differ, and how to set up the tools you will use all programme.",
  objectives: [
    "Explain why understanding the basics of technology matters, and set a personal goal for the programme.",
    "Explain what the digital economy is, with Ghanaian examples.",
    "Tell data analytics, machine learning and artificial intelligence apart.",
    "Open and run a notebook in Google Colab and in Jupyter.",
  ],
  lesson: [
    { h: "You can do this", blocks: [
      { p: "Nobody is born knowing how to code. Every programmer, data scientist and AI engineer started exactly where you are now: no experience, lots of questions, and plenty of error messages. What they had was curiosity and the willingness to keep going. You have that too, or you would not be here." },
      { p: "You also know more than you think:" },
      { list: [
        "You already use technology every day: mobile money, WhatsApp, maps, online banking. You understand what good technology feels like to use.",
        "You already solve problems: every maths question and science experiment at school trained the same logical thinking that coding uses.",
        "You know your community: its markets, schools, clinics and farms. That local knowledge is exactly what AI built elsewhere is missing, and it is your advantage.",
      ]},
      { note: "Trainer tip: share your own story of the first time you wrote code or got stuck. Learners relax when they hear that the facilitator struggled too." },
    ]},
    { h: "Why the basics matter", blocks: [
      { p: "Artificial intelligence can look like magic. It is not. It is built from the same foundations you will learn in this phase: clear step-by-step thinking, a programming language, and well-organised data. Understanding the basics turns you from someone who only uses technology into someone who can question it, fix it and build it." },
      { table: { head: ["The basics give you…", "Because…"], rows: [
        ["Skills that last", "Programming logic and SQL have been used for decades and still power today's newest AI. Tools change; foundations stay."],
        ["A route to everything else", "Machine learning is Python plus data. AI apps run on databases. Every later phase in this programme builds on Phase 1."],
        ["Protection", "People who understand how technology works are better at spotting scams, fake news, deepfakes and misuse of their personal data."],
        ["Opportunity", "Banks, telecoms, hospitals, farms, NGOs and government offices in Ghana all need people who can work with data."],
        ["A voice", "When you understand AI, you can help decide how it is used in your community instead of having those decisions made for you."],
      ]}},
      { note: "Africa needs builders, not only users. Google opened its first AI research centre in Africa in Accra in 2019, and the African Union's AI strategy (2024) calls for young Africans with exactly these skills. The opportunity is here, at home." },
    ]},
    { h: "How to succeed in this programme", blocks: [
      { list: [
        "Practise a little every day: 30 minutes daily beats five hours once a week.",
        "Treat error messages as clues, not failures. Every error tells you what to fix next.",
        "Ask questions early. In a room of learners, if you are confused, others are too.",
        "Help a classmate. Explaining something is the fastest way to understand it yourself.",
        "Celebrate small wins: the first program that runs, the first chart you make, the first query that works.",
        "Add one word to your vocabulary: 'yet'. 'I can't do this' becomes 'I can't do this yet.' That one word is the difference between giving up and growing.",
      ]},
    ]},
    { h: "The digital economy", blocks: [
      { p: "The digital economy is the part of economic activity that runs on digital technology and data: payments, e-commerce, digital government services, online work and the data these produce." },
      { p: "Ghana already lives in it. Mobile money lets millions of people send and receive money without a bank account. The Ghana Card links identity to services. GhanaPostGPS gives every location a digital address. Each of these produces data, and data is the raw material of AI." },
      { p: "Democratising AI means making sure Africans are builders of AI, not only users of tools made elsewhere. That needs three things: skills (this programme), data that reflects African realities, and access to computing power. The African Union's Continental AI Strategy (2024) sets out the same goals for the whole continent." },
    ]},
    { h: "Analytics, machine learning and AI", blocks: [
      { p: "These terms overlap, but they are not the same. Think of them as nested circles: AI is the largest, machine learning sits inside it, and deep learning sits inside machine learning. Data analytics overlaps with all of them." },
      { table: { head: ["Term", "What it does", "Mobile money example"], rows: [
        ["Data analytics", "Examines data to answer questions about what happened and why", "Which regions sent the most money last month?"],
        ["Machine learning (ML)", "Learns patterns from data to make predictions without being given explicit rules", "Is this transaction likely to be fraud?"],
        ["Artificial intelligence (AI)", "The broad field of systems that perform tasks that normally need human intelligence", "A chatbot that answers customers in Twi and English"],
        ["Deep learning", "ML using many-layered neural networks, used for images, speech and language", "Reading a photo of a handwritten receipt"],
      ]}},
      { p: "Analytics comes in four levels of ambition: descriptive (what happened), diagnostic (why it happened), predictive (what will happen) and prescriptive (what we should do)." },
    ]},
    { h: "Setting up your tools", blocks: [
      { p: "A notebook mixes code, results and notes in one document. You will use two kinds." },
      { list: [
        "Google Colab: runs in the browser with a Google account. Nothing to install, free access to GPUs, saves to Google Drive. Best for low-spec laptops.",
        "Jupyter Notebook: runs on your own computer. Install Python, then run 'pip install notebook' and start it with 'jupyter notebook'. Works offline once installed.",
      ]},
      { p: "Run this in your first cell to check that everything works:" },
      { code: `import sys
print("Hello from Ghana!")
print("Python version:", sys.version)`, lang: "python" },
      { note: "Tip: in Colab, press Shift + Enter to run a cell. Add a text cell above your code to explain what it does; that habit makes your notebooks readable for others." },
    ]},
  ],
  terms: [
    ["Digital economy", "Economic activity built on digital technology and data."],
    ["Algorithm", "A step-by-step set of instructions to solve a problem."],
    ["Model", "A program that has learned patterns from data and can make predictions."],
    ["Notebook", "A document that combines live code, outputs and text."],
  ],
  practice: {

    steps: [

    { q: "Which statement about AI and machine learning is correct?", options: ["AI is a type of machine learning", "Machine learning is a type of AI", "They are completely separate fields", "They mean exactly the same thing"], answer: 1, why: "Machine learning is one approach within the broader field of AI." },
    { q: "Why is Google Colab a good starting tool for many learners?", options: ["It only works offline", "It runs in a browser with nothing to install", "It requires a powerful laptop", "It cannot run Python"], answer: 1, why: "Colab runs on Google's servers, so a basic laptop or even a tablet is enough." },
    { q: "Predicting next month's maize prices is which level of analytics?", options: ["Descriptive", "Diagnostic", "Predictive", "Prescriptive"], answer: 2, why: "Forecasting what will happen is predictive analytics." },
  ],
  resources: [
    ["Elements of AI (free course)", "https://www.elementsofai.com/"],
    ["Google Colab", "https://colab.research.google.com/"],

{

      { p: "A variable is a name that points to a value. Python works out the type for you." },

      { table: { head: ["Structure", "Use it when", "Can change?"], rows: [
        ["List [ ]", "You have an ordered collection of items", "Yes"],

      { p: "Conditionals choose what to do; loops repeat work. Indentation (four spaces) shows which lines belong to a block." },
      { code: `scores = [45, 72, 88, 59, 91]

for s in scores:
    if s >= 80:
        print(s, "Excellent")
    elif s >= 50:
        print(s, "Pass")
    else:
        print(s, "Needs support")

count = 0
while count < 3:
    print("Attempt", count + 1)
    count += 1`, lang: "python" },
      { p: "Algorithmic thinking means breaking a problem into clear steps before you code. Write the steps in plain English first, then translate each step into Python." },
    ]},
    { h: "Functions and modular code", blocks: [
      { p: "A function packages steps under a name so you can reuse them. Small, well-named functions make programs easier to test and share." },
      { code: `def grade(score):
    """Return a letter grade for a score from 0 to 100."""
    if score >= 80:
        return "A"
    elif score >= 70:
        return "B"
    elif score >= 50:
        return "C"

        ["IndexError", "List position does not exist", "Check len(); lists start at 0"],

      { note: "Using AI to debug: paste the error and ask the assistant to explain it. Then make sure you understand the fix before you use it. If you cannot explain a line, you do not own it yet." },

  terms: [
    ["Variable", "A name that refers to a value."],
    ["Loop", "Code that repeats: 'for' over items, 'while' until a condition fails."],
    ["Function", "A named, reusable block of code that can take inputs and return a result."],
    ["Traceback", "Python's error report showing where the problem happened."],
  ],
  practice: {
    task: "Write a mobile money fee calculator. Use these example rules (not real network fees): the fee is 1% of the amount, at least GHS 0.50 and at most GHS 10.00.",
    steps: [
      "Write a function momo_fee(amount) that applies the rules.",
      "Loop over the transactions [20, 150, 2000, 45.5] and print each fee.",
      "Print the total fees collected.",
    ],
    solution: { code: `def momo_fee(amount):
    fee = amount * 0.01
    return max(0.50, min(fee, 10.0))

transactions = [20, 150, 2000, 45.5]
total = 0
for t in transactions:
    f = momo_fee(t)
    print(f"GHS {t:.2f} -> fee GHS {f:.2f}")
    total += f

print("Total fees:", round(total, 2))

# Output:
# GHS 20.00 -> fee GHS 0.50
# GHS 150.00 -> fee GHS 1.50
# GHS 2000.00 -> fee GHS 10.00
# GHS 45.50 -> fee GHS 0.50
# Total fees: 12.5`, lang: "python",
      text: "min(fee, 10.0) caps the fee at the maximum; max(0.50, ...) lifts it to the minimum. Combining them in one line is a common pattern for keeping a value inside a range." },

  quiz: [

  resources: [

{
  id: "m1-3", phase: "p1", num: "1.3", title: "Database Management & SQL", hours: 6,
  summary: "How relational databases organise data, how to write SQL queries from simple filters to joins and subqueries, and how to connect to a database from Python safely.",
  objectives: [
    "Describe tables, rows, columns, primary keys and foreign keys.",
    "Write SELECT queries with WHERE, ORDER BY, JOIN, GROUP BY and subqueries.",
    "Query a database from Python using parameters and keep credentials secret.",
  ],
  lesson: [
    { h: "Relational database architecture", blocks: [
      { note: "Good news: SQL reads almost like English. 'SELECT name FROM students WHERE score > 70' says exactly what it does. With the Python you learned in Module 1.2, you now have two of the most requested skills in data jobs worldwide." },
      { p: "A relational database stores data in tables. Each row is one record; each column is one attribute. Tables are linked through keys." },
      { list: [
        "Primary key: a column that uniquely identifies each row, such as school_id.",
        "Foreign key: a column that points to a primary key in another table, such as students.school_id.",
        "Normalisation: storing each fact once (the school's region lives in the schools table only), which avoids contradictions.",
      ]},
      { code: `CREATE TABLE schools (
  school_id INTEGER PRIMARY KEY,
  name      TEXT NOT NULL,
  region    TEXT NOT NULL
);

CREATE TABLE students (
  student_id INTEGER PRIMARY KEY,
  name       TEXT NOT NULL,
  school_id  INTEGER REFERENCES schools(school_id),
  math_score INTEGER
);`, lang: "sql" },
    ]},
    { h: "Writing SQL queries", blocks: [
      { p: "Filter and sort:" },
      { code: `SELECT name, math_score
FROM students
WHERE math_score >= 70
ORDER BY math_score DESC;`, lang: "sql" },
      { p: "JOIN combines tables on a matching key. INNER JOIN keeps only matches; LEFT JOIN keeps every row from the left table even without a match." },
      { code: `SELECT s.name AS student, sc.name AS school, sc.region
FROM students s
JOIN schools sc ON s.school_id = sc.school_id;`, lang: "sql" },
      { p: "GROUP BY summarises groups. WHERE filters rows before grouping; HAVING filters groups after." },
      { code: `SELECT sc.region,
       COUNT(*)                   AS n_students,
       ROUND(AVG(s.math_score), 1) AS avg_math
FROM students s
JOIN schools sc ON s.school_id = sc.school_id
GROUP BY sc.region
HAVING COUNT(*) >= 2
ORDER BY avg_math DESC;`, lang: "sql" },
      { p: "A subquery is a query inside a query:" },
      { code: `SELECT name, math_score
FROM students
WHERE math_score > (SELECT AVG(math_score) FROM students);`, lang: "sql" },
      { note: "Efficient queries: select only the columns you need instead of SELECT *, filter early with WHERE, and add indexes on columns you join or filter on often." },
    ]},
    { h: "Connecting from Python, securely", blocks: [
      { code: `import os
import sqlite3
import pandas as pd

conn = sqlite3.connect("school.db")

region = "Volta"
query = """
SELECT sc.name, AVG(s.math_score) AS avg_math
FROM students s JOIN schools sc ON s.school_id = sc.school_id
WHERE sc.region = ?
GROUP BY sc.name
"""
df = pd.read_sql_query(query, conn, params=(region,))
print(df)
conn.close()

# For a server database, read secrets from the environment, never from code:
db_password = os.environ.get("DB_PASSWORD")`, lang: "python" },
      { list: [
        "Use parameters (the ? placeholder), never string concatenation. Concatenation allows SQL injection.",
        "Keep passwords in environment variables or a secrets manager, and never commit them to GitHub.",
        "Give each app a database user with only the permissions it needs (least privilege), e.g. read-only for dashboards.",
        "Use encrypted connections (SSL/TLS) for databases on a network.",
      ]},
    ]},
  ],
  terms: [
    ["Primary key", "A column whose value uniquely identifies each row."],
    ["Foreign key", "A column that references the primary key of another table."],
    ["JOIN", "Combines rows from two tables using a related column."],
    ["SQL injection", "An attack where user input is run as SQL. Prevented by parameters."],
  ],
  practice: {
    task: "Using the schools and students tables above, list each school with the number of students scoring below 50, so the programme knows where to send extra support.",
    steps: [
      "Join students to schools.",
      "Keep only rows where math_score is below 50.",
      "Count students per school and sort from most to fewest.",
    ],
    solution: { code: `SELECT sc.name AS school,
       sc.region,
       COUNT(*) AS below_50
FROM students s
JOIN schools sc ON s.school_id = sc.school_id
WHERE s.math_score < 50
GROUP BY sc.name, sc.region
ORDER BY below_50 DESC;`, lang: "sql",
      text: "WHERE removes students at 50 or above before counting. Schools with no struggling students do not appear; use a LEFT JOIN with a CASE expression if you need them listed with zero." },
  },
  quiz: [
    { q: "Which clause filters groups after GROUP BY?", options: ["WHERE", "HAVING", "ORDER BY", "LIMIT"], answer: 1, why: "WHERE filters rows before grouping; HAVING filters the grouped results." },
    { q: "A LEFT JOIN from schools to students returns…", options: ["Only schools that have students", "Every school, with student data where it exists", "Only students without a school", "Every possible pair of rows"], answer: 1, why: "LEFT JOIN keeps every row of the left table and fills missing matches with NULL." },
    { q: "What is the safest way to put user input into a query?", options: ["Join strings together", "Use parameter placeholders", "Remove spaces first", "Use SELECT *"], answer: 1, why: "Parameters keep data separate from the SQL command and prevent injection." },
    { q: "students.school_id references schools.school_id. In the students table it is a…", options: ["Primary key", "Foreign key", "Index", "Subquery"], answer: 1, why: "It points to the primary key of another table." },
  ],
  resources: [
    ["SQLBolt: interactive SQL lessons", "https://sqlbolt.com/"],
    ["SQLite language reference", "https://www.sqlite.org/lang.html"],
    ["pandas read_sql_query", "https://pandas.pydata.org/docs/reference/api/pandas.read_sql_query.html"],
  ],
},

{
  id: "vc-1", phase: "vc", num: "2.1", title: "Version Control with Git", hours: 6,
  summary: "Why version control matters, and how to use Git to save snapshots of your work, see what changed, undo mistakes and try ideas safely on branches.",
  objectives: [
    "Explain what version control is and why every data and AI team uses it.",
    "Use Git to create a repository, stage and commit changes, and read the history.",
    "Undo mistakes, keep private files out of Git, and try ideas on a branch.",
  ],
  lesson: [
    { h: "You're ready for Phase 2", blocks: [
      { p: "You have written your first Python programs and SQL queries. Now you will learn the habit every professional developer relies on: keeping a safe history of everything you build. Version control sounds technical, but the idea is simple, and you have probably needed it already." },
      { p: "You already have what you need:" },
      { list: [
        "Files and folders: Git simply keeps track of the files you already create.",
        "Your Phase 1 Python and SQL work: the first projects you will put under version control.",
        "Group projects from school: GitHub is how technology teams do group work.",
      ]},
      { p: "Why this matters: companies, research teams and open-source projects all use Git and GitHub. A GitHub profile full of your own projects is often the first thing a recruiter looks at, and it costs nothing to build." },
      { note: "Trainer tip: ask learners whether they have ever had files called final.docx, final_v2.docx and final_REALLY_final.docx. Everyone laughs, and everyone immediately understands why version control exists." },
    ]},
    { h: "What version control is", blocks: [
      { p: "Version control records every change to your files as a series of snapshots, with who made each change, when and why. You can go back to any snapshot, compare versions, and combine work from several people without anyone overwriting anyone else." },
      { table: { head: ["", "What it is", "Gives you"], rows: [
        ["Git", "A free program on your computer that records your project's history", "Snapshots, undo, branches; works offline"],
        ["GitHub", "A website that stores Git projects online", "Backup, sharing, teamwork, and a public portfolio"],
      ]}},
      { list: [
        "Repository (repo): a project folder whose history Git tracks.",
        "Commit: one saved snapshot, with a message explaining the change.",
        "Staging area: where you choose which changes go into the next commit.",
        "Branch: a separate line of work, so you can experiment without breaking the main version.",
      ]},
    ]},
    { h: "Your first repository", blocks: [
      { p: "Install Git from git-scm.com (on Windows, Git for Windows includes a terminal called Git Bash). Then run the one-time setup and create your first repository:" },
      { code: `# One-time setup: use the email address on your GitHub account
git config --global user.name "Ama Mensah"
git config --global user.email "ama@example.com"
git config --global init.defaultBranch main

# Start tracking a project folder
mkdir rainfall-analysis
cd rainfall-analysis
git init

# Create a file, then save a snapshot of it
echo "# Rainfall analysis for the Northern Region" > README.md
git status                  # README.md is "untracked"
git add README.md           # stage it
git commit -m "Add project README"
git log --oneline           # see the history`, lang: "bash" },
    ]},
    { h: "The everyday cycle", blocks: [
      { list: [
        "1. Edit your files as usual.",
        "2. git status: see which files changed.",
        "3. git diff: see exactly which lines changed.",
        "4. git add <file>: stage the changes you want to keep together.",
        "5. git commit -m \"message\": save the snapshot.",
      ]},
      { table: { head: ["Unhelpful message", "Helpful message"], rows: [
        ["update", "Fill missing rainfall with the station median"],
        ["fixed it", "Stop chart crashing when a month has no data"],
        ["stuff", "Add bar chart of enrolment by region"],
      ]}},
      { note: "Commit one logical change at a time, and write the message so a teammate understands it without opening the code. Small, frequent commits make mistakes easy to undo." },
    ]},
    { h: "Keeping files private and undoing mistakes", blocks: [
      { p: "A file called .gitignore lists files Git should never track. Create it in every project:" },
      { code: `# API keys and passwords: never commit these
.env

# Large or private data files
*.csv

# Python and Jupyter clutter
__pycache__/
.ipynb_checkpoints/`, lang: "gitignore" },
      { table: { head: ["Situation", "Command"], rows: [
        ["Throw away unsaved edits to a file", "git restore analysis.py"],
        ["Unstage a file you added by mistake", "git restore --staged analysis.py"],
        ["Undo a commit you have already shared", "git revert <commit-id> (adds a new commit that reverses it)"],
        ["Look at an old version", "git log --oneline, then git show <commit-id>"],
      ]}},
      { note: "Never commit personal data, such as names with phone numbers or Ghana Card numbers. Git keeps everything in its history, so removing data after it has been shared is very hard. Ghana's Data Protection Act, 2012 (Act 843) applies." },
    ]},
    { h: "Branches: try ideas safely", blocks: [
      { p: "A branch is a parallel version of your project. Experiment freely: if the idea works, merge it in; if it fails, delete the branch and main is untouched." },
      { code: `git switch -c try-new-chart      # create a branch and move to it

def run_agent(goal, tools, llm, max_steps=5):
    history = [f"Goal: {goal}"]

        decision = llm.decide(history, tools)   # a tool call or a final answer

<script id="deck">
/* ───────── PowerPoint export: one deck per phase ───────── */
const DECK = {
  W: 13.333, X: 0.6, CW: 12.133, TOP: 1.45, BOTTOM: 6.85,
  C: { accent: "6D28D9", accentSoft: "EEF2FF", gold: "6D28D9", goldSoft: "EEF2FF", ink: "0F172A",
       muted: "64748B", line: "E2E8F0", sunk: "EEF2FF", code: "F1F5F9", white: "FFFFFF" },
  F: { body: "Arial", mono: "Consolas" },
};
const FOOTER = "Youth in AI × Proficio Global Impact Foundation · Data Science & AI Training";
const lineCount = (text, cpl) => String(text).split("\n").reduce((n, l) => n + Math.max(1, Math.ceil(l.length / cpl)), 0);
const cplFor = (width, size) => Math.floor(width * 72 / (size * 0.52));
const lineH = size => size * 1.3 / 72;

function textUnit(text, o = {}) {
  const size = o.size || 16;
  const pad = o.fill ? 0.25 : 0;
  const h = lineCount(text, cplFor(DECK.CW - pad, size)) * lineH(size) + 0.08 + pad;
  return { h, draw: (s, y) => s.addText(text, {
    x: DECK.X, y, w: DECK.CW, h, fontSize: size, fontFace: DECK.F.body, color: o.color || DECK.C.ink,
    bold: !!o.bold, valign: "top", margin: o.fill ? 8 : 0, fill: o.fill ? { color: o.fill } : undefined,
  }) };
}

function listUnits(items, numbered) {
  const size = 16, cpl = cplFor(DECK.CW - 0.4, size), units = [];
  let chunk = [], h = 0.08, start = 0;
  const flush = () => {
    if (!chunk.length) return;
    const its = chunk, first = start, hh = h;
    units.push({ h: hh, draw: (s, y) => s.addText(its.map((t, i) => ({ text: t, options: {
      bullet: numbered ? { type: "number", numberStartAt: first + i + 1 } : true,
      breakLine: i < its.length - 1, paraSpaceAfter: 6 } })),
      { x: DECK.X, y, w: DECK.CW, h: hh, fontSize: size, fontFace: DECK.F.body, color: DECK.C.ink, valign: "top", margin: 0 }) });
    start += chunk.length; chunk = []; h = 0.08;
  };
  items.forEach(t => {
    const ih = lineCount(t, cpl) * lineH(size) + 0.09;
    if (h + ih > 5.2) flush();
    chunk.push(t); h += ih;
  });
  flush();
  return units;
}

function codeUnits(code) {
  const lines = code.split("\n"), per = 28, units = [];
  const cuts = [];
  for (let i = 0; i < lines.length; i += per) cuts.push(lines.slice(i, i + per));
  if (cuts.length > 1 && cuts[cuts.length - 1].length <= 4) cuts[cuts.length - 2] = cuts[cuts.length - 2].concat(cuts.pop());
  for (const chunk of cuts) {
    const part = chunk.join("\n");
    const h = lineCount(part, 124) * (10.5 * 1.22 / 72) + 0.3;
    units.push({ h, draw: (s, y) => s.addText(part, {
      x: DECK.X, y, w: DECK.CW, h, fontFace: DECK.F.mono, fontSize: 10.5, color: DECK.C.ink,
      fill: { color: DECK.C.code }, valign: "top", margin: 8,
    }) });
  }
  return units;
}

function tableUnits(head, rows) {
  const size = 12;
  const weights = head.map((hd, i) => Math.sqrt(Math.max(8, hd.length, ...rows.map(r => String(r[i]).length))));
  const total = weights.reduce((a, b) => a + b, 0);
  const colW = weights.map(w => +(w / total * DECK.CW).toFixed(3));
  const rowH = r => Math.max(...r.map((c, i) => lineCount(c, Math.max(6, cplFor(colW[i], size) - 2)))) * (size * 1.25 / 72) + 0.16;
  const headH = rowH(head), units = [];
  let chunk = [], h = headH;
  const flush = () => {
    if (!chunk.length) return;
    const rs = chunk, hh = h;
    units.push({ h: hh, draw: (s, y) => s.addTable(
      [head.map(t => ({ text: t, options: { bold: true, fill: { color: DECK.C.sunk } } })),
       ...rs.map(r => r.map(c => ({ text: String(c) })))],
      { x: DECK.X, y, w: DECK.CW, colW, fontSize: size, fontFace: DECK.F.body, color: DECK.C.ink,
        border: { type: "solid", pt: 0.75, color: DECK.C.line }, valign: "top" }) });
    chunk = []; h = headH;
  };
  rows.forEach(r => { const rh = rowH(r); if (h + rh > 5.3) flush(); chunk.push(r); h += rh; });
  flush();
  return units;
}

function blockUnits(b) {
  if (b.p) return [textUnit(b.p)];
  if (b.list) return listUnits(b.list, false);
  if (b.code) return codeUnits(b.code);
  if (b.table) return tableUnits(b.table.head, b.table.rows);
  if (b.note) return [textUnit("Note. " + b.note, { size: 14, fill: DECK.C.goldSoft })];
  return [];
}

function contentSlide(pptx, title, eyebrow) {
  const s = pptx.addSlide({ masterName: "CONTENT" });
  s.addText(eyebrow, { x: DECK.X, y: 0.35, w: DECK.CW, h: 0.32, fontSize: 12, bold: true, color: DECK.C.accent, fontFace: DECK.F.body, margin: 0 });
  s.addText(title, { x: DECK.X, y: 0.7, w: DECK.CW, h: 0.6, fontSize: 26, bold: true, color: DECK.C.ink, fontFace: DECK.F.body, margin: 0, fit: "shrink" });
  return s;
}

function flow(pptx, title, eyebrow, units, notes) {
  let s = null, y = 0, page = 0;
  units.forEach(u => {
    if (!s || (y + u.h > DECK.BOTTOM && y > DECK.TOP + 0.01)) {
      s = contentSlide(pptx, page ? title + " (continued)" : title, eyebrow);
      if (notes && !page) s.addNotes(notes);
      y = DECK.TOP; page++;
    }
    u.draw(s, y);
    y += u.h + 0.18;
  });
}

function coverSlide(pptx, eyebrow, title, sub, meta, notes) {
  const s = pptx.addSlide();
  s.background = { color: DECK.C.accent };
  s.addShape(pptx.ShapeType.rect, { x: DECK.X, y: 2.05, w: 1.2, h: 0.08, fill: { color: "C4B5FD" }, line: { color: "C4B5FD" } });
  s.addText(eyebrow, { x: DECK.X, y: 1.45, w: DECK.CW, h: 0.4, fontSize: 16, bold: true, color: "DDD6FE", fontFace: DECK.F.body, margin: 0 });
  s.addText(title, { x: DECK.X, y: 2.35, w: DECK.CW, h: 1.5, fontSize: 40, bold: true, color: DECK.C.white, fontFace: DECK.F.body, valign: "top", margin: 0, fit: "shrink" });
  s.addText(sub, { x: DECK.X, y: 3.95, w: 10.5, h: 1.8, fontSize: 18, color: "EDE9FE", fontFace: DECK.F.body, valign: "top", margin: 0 });
  s.addText(meta, { x: DECK.X, y: 6.5, w: DECK.CW, h: 0.4, fontSize: 13, color: "DDD6FE", fontFace: DECK.F.body, margin: 0 });
  s.addImage({ data: LOGO.replace(/^data:/, ""), x: DECK.W - DECK.X - 1.0, y: 0.55, w: 1.0, h: 1.0 });
  if (notes) s.addNotes(notes);
  return s;
}

function buildPhaseDeck(phase) {
  const pptx = new PptxGenJS();
  pptx.layout = "LAYOUT_WIDE";
  pptx.author = "Youth in AI × Proficio Global Impact Foundation";
  pptx.company = "Youth in AI";
  pptx.title = "Phase " + phase.n + ": " + phase.title;
  pptx.defineSlideMaster({
    title: "CONTENT", background: { color: DECK.C.white },
    objects: [
      { rect: { x: 0, y: 7.05, w: DECK.W, h: 0.45, fill: { color: DECK.C.accent } } },
      { image: { x: DECK.W - DECK.X - 1.5, y: 0.28, w: 1.5, h: 0.301, data: WORDMARK.replace(/^data:/, "") } },
      { text: { text: FOOTER, options: { x: DECK.X, y: 7.05, w: 10, h: 0.45, fontSize: 10, color: DECK.C.white, fontFace: DECK.F.body, valign: "middle", margin: 0 } } },
    ],
    slideNumber: { x: 12.3, y: 7.13, w: 0.6, h: 0.3, fontSize: 10, color: DECK.C.white, fontFace: DECK.F.body },
  });

  const mods = MODULES.filter(m => m.phase === phase.id);
  const hours = mods.reduce((a, m) => a + m.hours, 0);
  const tag = "Phase " + phase.n + " · " + phase.title;

  coverSlide(pptx, "Phase " + phase.n + " of " + PHASES.length, phase.title + ": " + phase.subtitle, phase.objective,
    mods.length + " modules · about " + hours + " hours · Youth in AI × Proficio Global Impact Foundation");

  flow(pptx, "Phase overview", tag, [
    textUnit(phase.objective, { size: 18 }),
    ...tableUnits(["Module", "Title", "Hours", "Summary"], mods.map(m => [m.num, m.title, String(m.hours), m.summary])),
  ]);

  mods.forEach(m => {
    const eb = tag + " · Module " + m.num;
    coverSlide(pptx, "Module " + m.num, m.title, m.summary,
      "About " + m.hours + " hours · " + m.lesson.length + " lesson sections",
      "Module " + m.num + " objectives:\n" + m.objectives.map(o => "- " + o).join("\n"));
    flow(pptx, "Learning objectives", eb, listUnits(m.objectives, true));
    m.lesson.forEach(sec => flow(pptx, sec.h, eb, sec.blocks.flatMap(blockUnits)));
    flow(pptx, "Key terms", eb, tableUnits(["Term", "Meaning"], m.terms));

    const p = m.practice;
    flow(pptx, "Practice", eb, [
      textUnit(p.task, { size: 18, bold: true }),
      ...listUnits(p.steps, true),
      ...(p.nocode ? [textUnit("No-code version: " + p.nocode, { size: 14, fill: DECK.C.goldSoft })] : []),
      ...(p.starter ? [textUnit("Starter code", { size: 14, bold: true, color: DECK.C.muted }), ...codeUnits(p.starter.code)] : []),
    ]);
    flow(pptx, "Practice: model answer", eb, [...codeUnits(p.solution.code), textUnit(p.solution.text)],
      "Facilitator: show this slide only after learners have attempted the task.");

    const quizGrids = [];
    for (let k = 0; k < m.quiz.length; k += 4) {
      const group = m.quiz.slice(k, k + 4), base = k;
      quizGrids.push({ h: 5.3, draw: (s, y) => group.forEach((q, gi) => {
        const bw = (DECK.CW - 0.3) / 2, bh = 2.55;
        s.addText([
          { text: (base + gi + 1) + ". " + q.q, options: { bold: true, breakLine: true, paraSpaceAfter: 4 } },
          ...q.options.map((o, j) => ({ text: "ABCD"[j] + ".  " + o, options: { breakLine: j < q.options.length - 1, indentLevel: 1 } })),
        ], { x: DECK.X + (gi % 2) * (bw + 0.3), y: y + Math.floor(gi / 2) * (bh + 0.2), w: bw, h: bh,
             fontSize: 15, fontFace: DECK.F.body, color: DECK.C.ink, valign: "top", margin: 0, fit: "shrink" });
      }) });
    }
    flow(pptx, "Check your understanding", eb, quizGrids);
    flow(pptx, "Quiz answer key", eb,
      tableUnits(["#", "Answer", "Why"], m.quiz.map((q, i) => [String(i + 1), "ABCD"[q.answer] + ". " + q.options[q.answer], q.why])),
      "Facilitator: reveal after learners have answered.");

    flow(pptx, "Further reading", eb, [{ h: m.resources.length * 0.45, draw: (s, y) => s.addText(
      m.resources.flatMap(([label, url], i) => [
        { text: label, options: { hyperlink: { url }, bullet: true, color: DECK.C.accent } },
        { text: "   " + url, options: { color: DECK.C.muted, fontSize: 12, breakLine: i < m.resources.length - 1 } },
      ]), { x: DECK.X, y, w: DECK.CW, h: m.resources.length * 0.45, fontSize: 16, fontFace: DECK.F.body, valign: "top", margin: 0, paraSpaceAfter: 8 }) }]);
  });

  const tb = GUIDE.sections[1].blocks[1].table.rows[phase.n - 1];
  flow(pptx, "Trainer teach-back for this phase", tag, [
    textUnit("At the end of the phase, each facilitator explains one of these concepts back to the Technical Lead as if teaching a class.", { size: 18 }),
    ...listUnits(tb[1].split(". ").map(t => t.replace(/\.$/, "") + "."), false),
    textUnit(GUIDE.sections[1].blocks[2].note, { size: 14, fill: DECK.C.goldSoft }),
  ]);
  return pptx;
}

function phaseFileName(phase) { return "Phase-" + phase.n + "-" + phase.title.replace(/\s+/g, "-") + ".pptx"; }
</script>

<script id="app">
/* ───────────────────────── APP ───────────────────────── */
const { useState, useEffect } = React;
const html = htm.bind(React.createElement);
const I = LucideReact;
const ALL_IDS = MODULES.map(m => m.id);
const TOTAL_HOURS = MODULES.reduce((a, m) => a + m.hours, 0);
const cx = (...a) => a.filter(Boolean).join(" ");
const store = {
  get(k, fallback) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

const BTN = {
  primary: "inline-flex items-center justify-center gap-2 rounded-2xl bg-brand px-5 py-2.5 text-sm font-semibold text-white ring-1 ring-brand shadow-sm transition-all duration-200 hover:bg-white hover:text-brand hover:shadow-md active:scale-[0.98] disabled:pointer-events-none disabled:opacity-50",
  secondary: "inline-flex items-center justify-center gap-2 rounded-2xl bg-white px-5 py-2.5 text-sm font-semibold text-brand ring-1 ring-brand/30 shadow-sm transition-all duration-200 hover:bg-brand hover:text-white hover:ring-brand hover:shadow-md active:scale-[0.98] disabled:pointer-events-none disabled:opacity-40",
  ghost: "inline-flex items-center justify-center gap-2 rounded-2xl px-4 py-2.5 text-sm font-semibold text-slate-600 transition-all duration-200 hover:bg-brand-tint hover:text-brand disabled:pointer-events-none disabled:opacity-40",
};

/* ───────── Content blocks ───────── */
function CodeBlock({ code, lang }) {
  const [copied, setCopied] = useState(false);
  const copy = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1500); };
    try { navigator.clipboard.writeText(code).then(done).catch(() => {}); } catch (e) {}
  };
  return html`<div className="overflow-hidden rounded-2xl bg-ink shadow-md">
    <div className="flex items-center justify-between border-b border-white/10 px-4 py-2">
      <span className="font-mono text-xs uppercase tracking-wider text-slate-400">${lang || "code"}</span>
      <button onClick=${copy} className="inline-flex items-center gap-1.5 rounded-xl px-2.5 py-1 text-xs font-semibold text-slate-300 transition-all duration-200 hover:bg-white hover:text-brand">
        <${copied ? I.Check : I.Copy} size=${14} /> ${copied ? "Copied" : "Copy"}
      </button>
    </div>
    <pre className="overflow-x-auto p-4 font-mono text-[13px] leading-6 text-slate-100"><code>${code}</code></pre>
  </div>`;
}

function Blocks({ blocks }) {
  return blocks.map((b, i) => {
    if (b.p) return html`<p key=${i} className="max-w-[68ch] leading-7 text-slate-700">${b.p}</p>`;
    if (b.list) return html`<ul key=${i} className="flex max-w-[68ch] flex-col gap-2.5">
      ${b.list.map((li, j) => html`<li key=${j} className="flex gap-3 leading-7 text-slate-700">
        <span className="mt-[11px] h-1.5 w-1.5 flex-none rounded-full bg-brand"></span><span>${li}</span></li>`)}
    </ul>`;
    if (b.code) return html`<${CodeBlock} key=${i} code=${b.code} lang=${b.lang} />`;
    if (b.note) return html`<div key=${i} className="flex gap-3 rounded-2xl bg-brand-tint p-4 text-sm leading-6 text-ink">
      <${I.Lightbulb} size=${18} className="mt-0.5 flex-none text-brand" /><div>${b.note}</div></div>`;
    if (b.table) return html`<div key=${i} className="overflow-x-auto rounded-2xl bg-white shadow-soft ring-1 ring-line">
      <table className="w-full text-left text-sm">
        <thead className="bg-brand-tint"><tr>${b.table.head.map((h, j) => html`<th key=${j} className="whitespace-nowrap px-4 py-3 font-semibold text-ink">${h}</th>`)}</tr></thead>
        <tbody>${b.table.rows.map((r, j) => html`<tr key=${j} className="border-t border-line">
          ${r.map((c, k) => html`<td key=${k} className=${cx("px-4 py-3 align-top leading-6", k === 0 ? "font-medium text-ink" : "text-slate-600")}>${c}</td>`)}</tr>`)}</tbody>
      </table></div>`;
    return null;
  });
}

/* ───────── Quiz ───────── */
function Quiz({ items, onPass }) {
  const [picked, setPicked] = useState({});
  const [checked, setChecked] = useState(false);
  const score = items.reduce((s, q, i) => s + (picked[i] === q.answer ? 1 : 0), 0);
  const allAnswered = Object.keys(picked).length === items.length;
  useEffect(() => { if (checked && score / items.length >= 0.75) onPass(); }, [checked]);

  return html`<div className="flex flex-col gap-5">
    <p className="text-slate-600">Answer every question, then check. Score 75% or more and the module is marked complete.</p>
    ${items.map((q, i) => html`<fieldset key=${i} className="flex flex-col gap-4 rounded-2xl bg-white p-5 shadow-soft ring-1 ring-line/70 sm:p-6">
      <legend className="sr-only">Question ${i + 1}</legend>
      <p className="font-semibold leading-7 text-ink"><span className="mr-2 text-brand">${i + 1}.</span>${q.q}</p>
      <div className="grid gap-2.5 sm:grid-cols-2">
        ${q.options.map((o, j) => {
          const sel = picked[i] === j, right = checked && j === q.answer, wrong = checked && sel && j !== q.answer;
          return html`<label key=${j} className=${cx(
            "flex items-start gap-3 rounded-xl px-4 py-3 text-sm ring-1 transition-all duration-150 focus-within:ring-2 focus-within:ring-brand",
            checked ? "cursor-default" : "cursor-pointer",
            right ? "bg-emerald-50 text-emerald-900 ring-emerald-500"
              : wrong ? "bg-rose-50 text-rose-900 ring-rose-400"
              : sel ? "bg-brand-tint text-ink ring-brand"
              : "bg-white text-slate-700 ring-line hover:bg-brand-tint/60 hover:ring-brand/50")}>
            <input type="radio" className="sr-only" name=${"q" + i} id=${"q" + i + "o" + j} checked=${sel}
              disabled=${checked} onChange=${() => setPicked({ ...picked, [i]: j })} />
            <span className=${cx("flex h-6 w-6 flex-none items-center justify-center rounded-lg text-xs font-bold transition-colors",
              right ? "bg-emerald-500 text-white" : wrong ? "bg-rose-500 text-white" : sel ? "bg-brand text-white" : "bg-slate-100 text-slate-500")}>${"ABCD"[j]}</span>
            <span className="pt-0.5 leading-5">${o}</span>
          </label>`;
        })}
      </div>
      ${checked && html`<div className=${cx("flex gap-2.5 rounded-xl p-3.5 text-sm leading-6", picked[i] === q.answer ? "bg-emerald-50 text-emerald-900" : "bg-rose-50 text-rose-900")}>
        <${picked[i] === q.answer ? I.CheckCircle2 : I.HelpCircle} size=${18} className="mt-0.5 flex-none" />
        <span><b>${picked[i] === q.answer ? "Correct. " : "Not quite. "}</b>${q.why}</span></div>`}
    </fieldset>`)}
    <div className="flex flex-wrap items-center gap-3">
      ${!checked
        ? html`<button className=${BTN.primary} disabled=${!allAnswered} onClick=${() => setChecked(true)}><${I.Check} size=${16} /> Check answers</button>
               ${!allAnswered && html`<span className="text-sm text-slate-500">${Object.keys(picked).length} of ${items.length} answered</span>`}`
        : html`<div className="inline-flex items-center gap-2 rounded-2xl bg-brand-tint px-4 py-2.5 font-semibold text-brand tabular">
                 <${I.Trophy} size=${18} /> ${score} / ${items.length} correct</div>
               <button className=${BTN.secondary} onClick=${() => { setPicked({}); setChecked(false); }}><${I.RotateCcw} size=${16} /> Try again</button>`}
    </div>
  </div>`;
}

/* ───────── Practice ───────── */
function Practice({ p }) {
  const [show, setShow] = useState(false);
  return html`<div className="flex flex-col gap-6">
    <div className="flex flex-col gap-4 rounded-2xl bg-white p-6 shadow-soft ring-1 ring-line/70">
      <div className="flex items-center gap-3">
        <span className="flex h-10 w-10 items-center justify-center rounded-2xl bg-brand-tint text-brand"><${I.FlaskConical} size=${20} /></span>
        <h3 className="font-display text-lg font-bold text-ink">Your task</h3>
      </div>
      <p className="max-w-[68ch] leading-7 text-slate-700">${p.task}</p>
      <ol className="flex flex-col gap-3">
        ${p.steps.map((s, i) => html`<li key=${i} className="flex gap-3 leading-6 text-slate-700">
          <span className="flex h-6 w-6 flex-none items-center justify-center rounded-full bg-brand text-xs font-bold text-white">${i + 1}</span><span>${s}</span></li>`)}
      </ol>
    </div>
    ${p.nocode && html`<div className="flex gap-3 rounded-2xl bg-brand-tint p-5">
      <${I.Sparkles} size=${20} className="mt-0.5 flex-none text-brand" />
      <div className="flex flex-col gap-1"><h3 className="font-display font-bold text-ink">No-code version</h3>
        <p className="max-w-[68ch] leading-7 text-slate-700">${p.nocode}</p></div>
    </div>`}
    ${p.starter && html`<div className="flex flex-col gap-3"><h3 className="font-display text-lg font-bold">Starter code</h3><${CodeBlock} code=${p.starter.code} lang=${p.starter.lang} /></div>`}
    <div><button className=${BTN.secondary} onClick=${() => setShow(!show)} aria-expanded=${show}>
      <${show ? I.EyeOff : I.Eye} size=${16} /> ${show ? "Hide model answer" : "Show model answer"}</button></div>
    ${show && html`<div className="flex flex-col gap-3">
      <h3 className="font-display text-lg font-bold">Model answer</h3>
      <${CodeBlock} code=${p.solution.code} lang=${p.solution.lang} />
      <p className="max-w-[68ch] leading-7 text-slate-700">${p.solution.text}</p></div>`}
  </div>`;
}

/* ───────── PowerPoint download ───────── */
async function savePhaseDeck(phase) {
  const blob = await buildPhaseDeck(phase).write({ outputType: "blob" });
  const filename = phaseFileName(phase);
  if (window.claude && typeof window.claude.use === "function") {
    const dl = await window.claude.use("downloads");
    if (!dl) return { ok: false, msg: "Downloads aren't available in this view. Open the page in claude.ai, or open the HTML file on your computer." };
    try {
      await dl.save({ filename, data: blob });
      return { ok: true, msg: "Saved " + filename };
    } catch (e) {
      const code = e && e.code;
      if (code === "declined") return { ok: false, msg: "Download cancelled." };
      if (code === "rate_limited") return { ok: false, msg: "A download prompt is already open. Finish it, then try again." };
      return { ok: false, msg: "Couldn't save the slides (" + (code || "error") + ")." };
    }
  }
  // Opened as a local file: a normal browser download works.
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return { ok: true, msg: "Downloaded " + filename };
}

/* ───────── Learning Hub Guide (PDF published beside the page) ───────── */
const GUIDE_PDF = "Learning-Hub-Guide.pdf";

async function saveGuidePdf() {
  if (window.claude && typeof window.claude.use === "function") {
    const dl = await window.claude.use("downloads");
    if (!dl) return { ok: false, msg: "Downloads aren't available in this view. Open the page in claude.ai, or open the HTML file on your computer." };
    let blob;
    try {
      const r = await fetch(GUIDE_PDF);
      if (!r.ok) throw new Error(String(r.status));
      blob = await r.blob();
    } catch (e) {
      return { ok: false, msg: "Couldn't load the guide. Check your connection and try again." };
    }
    try {
      await dl.save({ filename: GUIDE_PDF, data: blob });
      return { ok: true, msg: "Saved " + GUIDE_PDF };
    } catch (e) {
      const code = e && e.code;
      if (code === "declined") return { ok: false, msg: "Download cancelled." };
      if (code === "rate_limited") return { ok: false, msg: "A download prompt is already open. Finish it, then try again." };
      return { ok: false, msg: "Couldn't save the guide (" + (code || "error") + ")." };
    }
  }
  // On a website (e.g. GitHub Pages) a normal download works. Opened as a local file, browsers
  // ignore "download", so open the PDF (kept in the same folder as this page) in a new tab instead.
  const local = location.protocol === "file:";
  const a = document.createElement("a");
  a.href = GUIDE_PDF;
  if (local) { a.target = "_blank"; a.rel = "noopener"; } else { a.download = GUIDE_PDF; }
  document.body.appendChild(a); a.click(); a.remove();
  return local
    ? { ok: true, msg: "Opened the guide in a new tab. Use your browser's save button to keep a copy. If it doesn't open, keep " + GUIDE_PDF + " in the same folder as this page." }
    : { ok: true, msg: "Downloading " + GUIDE_PDF + "." };
}

function GuideDownload({ variant, hint }) {
  const [busy, setBusy] = useState(false);
  const [res, setRes] = useState(null);
  const run = async () => {
    setBusy(true); setRes(null);
    try { setRes(await saveGuidePdf()); }
    catch (e) { setRes({ ok: false, msg: "Couldn't download the guide. Try again." }); }
    setBusy(false);
  };
  const status = res
    ? html`<span aria-live="polite" className=${cx("inline-flex items-start gap-1.5", variant === "nav" ? "text-xs" : "text-sm", res.ok ? "text-emerald-700" : "text-rose-700")}>
        <${res.ok ? I.CheckCircle2 : I.HelpCircle} size=${14} className="mt-0.5 flex-none" />${res.msg}</span>`
    : hint ? html`<span className="text-sm text-slate-500">${hint}</span>` : null;
  if (variant === "nav") return html`<div className="flex flex-col gap-1">
    <button onClick=${run} disabled=${busy}
      className="flex items-center gap-3 rounded-xl px-3 py-2 text-left text-sm font-semibold text-slate-600 transition-colors hover:bg-slate-50 hover:text-ink disabled:opacity-60">
      <${busy ? I.Loader2 : I.FileDown} size=${16} className=${busy ? "animate-spin" : ""} /> Learning Hub Guide (PDF)</button>
    ${status && html`<div className="px-3">${status}</div>`}
  </div>`;
  return html`<div className="flex flex-wrap items-center gap-x-4 gap-y-2">
    <button className=${BTN.secondary} onClick=${run} disabled=${busy}>
      <${busy ? I.Loader2 : I.FileDown} size=${16} className=${busy ? "animate-spin" : ""} />
      ${busy ? "Preparing…" : "Download the guide"}
      ${!busy && html`<span className="rounded-lg bg-brand-tint px-1.5 py-0.5 font-mono text-[11px] text-brand">.pdf</span>`}
    </button>
    ${status}
  </div>`;
}

function PhaseDownload({ phase, hint }) {
  const [busy, setBusy] = useState(false);
  const [res, setRes] = useState(null);
  const run = async () => {
    if (typeof PptxGenJS === "undefined") { setRes({ ok: false, msg: "The slide builder didn't load. Check your connection and reload the page." }); return; }
    setBusy(true); setRes(null);
    try { setRes(await savePhaseDeck(phase)); }
    catch (e) { setRes({ ok: false, msg: "Couldn't build the slides. Reload the page and try again." }); }
    setBusy(false);
  };
  return html`<div className="flex flex-wrap items-center gap-x-4 gap-y-2">
    <button className=${BTN.secondary} onClick=${run} disabled=${busy}>
      <${busy ? I.Loader2 : I.Presentation} size=${16} className=${busy ? "animate-spin" : ""} />
      ${busy ? "Building slides…" : "Download Phase " + phase.n + " slides"}
      ${!busy && html`<span className="rounded-lg bg-brand-tint px-1.5 py-0.5 font-mono text-[11px] text-brand">.pptx</span>`}
    </button>
    <span aria-live="polite" className=${cx("inline-flex items-center gap-1.5 text-sm", res ? (res.ok ? "text-emerald-700" : "text-rose-700") : "text-slate-500")}>
      ${res && html`<${res.ok ? I.CheckCircle2 : I.HelpCircle} size=${15} />`}${res ? res.msg : hint}
    </span>
  </div>`;
}

/* ───────── In-page section menu ───────── */
const scrollToId = id => {
  const el = document.getElementById(id);
  if (!el) return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
};

function useActiveSection(ids) {
  const [active, setActive] = useState(ids[0]);
  useEffect(() => {
    if (!("IntersectionObserver" in window)) return;
    const seen = new Map();
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => seen.set(e.target.id, e.isIntersecting));
      const first = ids.find(id => seen.get(id));
      if (first) setActive(first);
    }, { rootMargin: "-96px 0px -55% 0px" });
    ids.forEach(id => { const el = document.getElementById(id); if (el) obs.observe(el); });
    return () => obs.disconnect();
  }, [ids.join("|")]);
  return [active, setActive];
}

function SectionMenu({ items, active, onPick, label }) {
  const strip = React.useRef(null);
  // On phones the strip scrolls sideways: keep the current section's button in view.
  useEffect(() => {
    const box = strip.current;
    const btn = box && box.querySelector('[data-sec="' + active + '"]');
    if (!btn || box.scrollWidth <= box.clientWidth) return;
    box.scrollTo({ left: btn.offsetLeft - box.clientWidth / 2 + btn.offsetWidth / 2, behavior: "smooth" });
  }, [active]);
  return html`<nav aria-label=${label} className="sticky-top z-20 -mx-2 bg-white/90 px-2 py-2 backdrop-blur">
    <div ref=${strip} className="no-scrollbar relative flex items-center gap-2 overflow-x-auto sm:flex-wrap sm:overflow-visible">
      <span className="hidden flex-none items-center gap-1.5 pr-1 text-xs font-bold uppercase tracking-wider text-slate-400 sm:flex"><${I.List} size=${14} /> On this page</span>
      ${items.map(it => html`<button key=${it.id} data-sec=${it.id} onClick=${() => onPick(it.id)} aria-current=${active === it.id ? "location" : null}
        className=${cx("inline-flex flex-none items-center gap-1.5 whitespace-nowrap rounded-xl px-3 py-1.5 text-[13px] font-semibold transition-all duration-200",
          active === it.id ? "bg-brand text-white shadow-sm" : it.special ? "bg-brand-tint text-brand hover:bg-brand hover:text-white" : "bg-slate-100 text-slate-600 hover:bg-brand-tint hover:text-brand")}>
        ${it.icon && html`<${it.icon} size=${14} />`}${it.label}</button>`)}
    </div>
  </nav>`;
}

function LessonBody({ m }) {
  const items = [

function ModuleView({ m, done, toggleDone, markDone, go }) {

  const isDone = done.includes(m.id);
  const tabs = [
    ["lesson", "Lesson", I.BookOpen],
    ["practice", "Practice", I.FlaskConical],
    ["quiz", "Quiz", I.HelpCircle, m.quiz.length],
    ["resources", "Resources", I.Library, m.resources.length],
  ];

  return html`<div className="mx-auto flex max-w-3xl flex-col gap-8">
    <header className="flex flex-col gap-4">
      <div className="flex flex-wrap items-center gap-2 text-sm font-semibold">

        ${isDone && html`<span className="inline-flex items-center gap-1.5 rounded-full bg-brand px-3 py-1 font-semibold text-white"><${I.CheckCircle2} size=${14} /> Completed</span>`}

      <h2 className="mb-3 flex items-center gap-2 font-display text-lg font-bold text-ink"><${I.Target} size=${20} className="text-brand" /> By the end of this module you can</h2>
      <ul className="flex flex-col gap-2">

/* ───────── Sidebar ───────── */
function Sidebar({ cur, done, go, q, setQ, onClose, idSuffix }) {
  const pct = Math.round(done.length / MODULES.length * 100);
  const match = m => {
    if (!q.trim()) return true;
    const s = q.toLowerCase();
    return (m.num + " " + m.title + " " + m.summary + " " + m.terms.map(t => t[0]).join(" ")).toLowerCase().includes(s);
  };
  const anyMatch = MODULES.some(match);
  const curPhase = (MODULES.find(x => x.id === cur) || {}).phase;
  const [openP, setOpenP] = useState(() => {
    const saved = store.get("yia-open-phases", null);
    if (Array.isArray(saved)) return new Set(saved.filter(id => PHASES.some(p => p.id === id)));
    return new Set([curPhase || (MODULES.find(x => !done.includes(x.id)) || MODULES[0]).phase]);
  });
  useEffect(() => { store.set("yia-open-phases", [...openP]); }, [openP]);
  const firstRun = React.useRef(true);
  useEffect(() => {
    // Opening a module elsewhere (search, Next, home cards) reveals its phase; a saved "all closed" state survives page load.
    if (firstRun.current) { firstRun.current = false; return; }
    if (curPhase) setOpenP(s => s.has(curPhase) ? s : new Set([...s, curPhase]));
  }, [curPhase]);
  const togglePhase = id => setOpenP(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const allClosed = openP.size === 0;
  const collapseAll = () => setOpenP(new Set());
  const expandAll = () => setOpenP(new Set(PHASES.map(p => p.id)));
  const searching = q.trim() !== "";
  return html`<div className="flex flex-col gap-6">
    <div className="flex items-center justify-between gap-2">
      <button onClick=${() => go("home")} aria-label="Youth in AI Learning Hub: home" className="flex flex-col items-start gap-1.5 rounded-2xl text-left">
        <img src=${WORDMARK} alt="Youth in AI" width="170" height="34" className="h-[34px] w-auto" />
        <span className="text-[11px] font-semibold uppercase tracking-[0.14em] text-slate-500">Learning Hub · with Proficio</span>
      </button>
      ${onClose && html`<button onClick=${onClose} aria-label="Close menu" className="rounded-xl p-2 text-slate-500 transition hover:bg-brand-tint hover:text-brand"><${I.X} size=${20} /></button>`}
    </div>

    <div className="flex flex-col gap-2 rounded-2xl bg-brand-tint p-4">
      <div className="flex items-baseline justify-between text-sm"><span className="font-semibold text-ink">Your progress</span>
        <span className="font-semibold text-brand tabular">${done.length}/${MODULES.length}</span></div>
      <div className="h-2 overflow-hidden rounded-full bg-white"><div className="h-full rounded-full bg-brand transition-all duration-500" style=${{ width: pct + "%" }}></div></div>
    </div>

    <label className="relative block">
      <span className="sr-only">Search modules</span>
      <${I.Search} size=${16} className="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
      <input id=${"search-" + idSuffix} type="search" value=${q} onInput=${e => setQ(e.target.value)} placeholder="Search modules or terms"
        className="w-full rounded-2xl border-0 bg-slate-50 py-2.5 pl-10 pr-3 text-sm text-ink ring-1 ring-line placeholder:text-slate-400 transition focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand" />
    </label>

    <button onClick=${() => go("home")} className=${cx("flex items-center gap-3 rounded-xl px-3 py-2 text-sm font-semibold transition-colors", cur === "home" ? "bg-brand-tint text-brand" : "text-slate-600 hover:bg-slate-50 hover:text-ink")}>
      <${I.Home} size=${16} /> Overview</button>

    <div className="-mb-3 flex items-center justify-between gap-2 px-3">
      <span className="text-[11px] font-bold uppercase tracking-[0.12em] text-slate-400">${searching ? "Search results" : "Modules"}</span>
      ${!searching && html`<button onClick=${allClosed ? expandAll : collapseAll} aria-label=${allClosed ? "Expand all phases" : "Collapse all phases"}
        className="inline-flex items-center gap-1.5 rounded-xl px-2.5 py-1.5 text-xs font-semibold text-brand ring-1 ring-brand/25 transition-all duration-200 hover:bg-brand hover:text-white hover:ring-brand">
        <${allClosed ? I.ChevronsUpDown : I.ChevronsDownUp} size=${14} /> ${allClosed ? "Expand all" : "Collapse all"}</button>`}
    </div>

    ${!anyMatch && html`<p className="px-3 text-sm text-slate-500">No modules match “${q}”.</p>`}
    ${PHASES.map(p => {
      const mods = MODULES.filter(x => x.phase === p.id && match(x));
      if (!mods.length) return null;
      const all = MODULES.filter(x => x.phase === p.id), dn = all.filter(x => done.includes(x.id)).length;
      const isOpen = searching || openP.has(p.id);
      return html`<nav key=${p.id} className="flex flex-col gap-1" aria-label=${"Phase " + p.n}>
        <button onClick=${() => togglePhase(p.id)} aria-expanded=${isOpen}
          className=${cx("flex w-full items-center justify-between gap-2 rounded-xl px-3 py-2 text-left text-[11px] font-bold uppercase tracking-[0.12em] transition-colors hover:bg-slate-50 hover:text-brand",
            curPhase === p.id ? "text-brand" : "text-slate-400")}>
          <span>Phase ${p.n} · ${p.title}</span>
          <span className="flex flex-none items-center gap-2 normal-case tracking-normal">
            <span className="tabular font-semibold">${dn}/${all.length}</span>
            <${I.ChevronDown} size=${14} className=${cx("transition-transform duration-200", isOpen ? "rotate-180" : "")} />
          </span>
        </button>
        ${isOpen && mods.map(x => {
          const active = cur === x.id, d = done.includes(x.id);
          return html`<button key=${x.id} onClick=${() => go(x.id)} aria-current=${active ? "page" : null}
            className=${cx("flex w-full items-start gap-3 rounded-xl px-3 py-2 text-left text-sm transition-colors duration-150",
              active ? "bg-brand-tint font-semibold text-brand" : "text-slate-600 hover:bg-slate-50 hover:text-ink")}>
            <span className=${cx("w-7 flex-none pt-px font-mono text-xs", active ? "text-brand" : "text-slate-400")}>${x.num}</span>
            <span className="min-w-0 flex-1 leading-5">${x.title}</span>
            <${d ? I.CheckCircle2 : I.Circle} size=${16} className=${cx("mt-0.5 flex-none", d ? "text-brand" : "text-slate-300")} aria-label=${d ? "complete" : "not complete"} />
          </button>`;
        })}
      </nav>`;
    })}

    <button onClick=${() => go("guide")} className=${cx("flex items-center gap-3 rounded-xl px-3 py-2 text-sm font-semibold transition-colors", cur === "guide" ? "bg-brand-tint text-brand" : "text-slate-600 hover:bg-slate-50 hover:text-ink")}>
      <${I.GraduationCap} size=${16} /> Assessment & ToT</button>
    <${GuideDownload} variant="nav" />
  </div>`;
}

/* ───────── App ───────── */
function App() {
  const valid = id => id === "home" || id === "guide" || ALL_IDS.includes(id);
  const [cur, setCur] = useState(() => { const h = location.hash.slice(1); return valid(h) ? h : "home"; });
  const [done, setDone] = useState(() => store.get("yia-done", []).filter(id => ALL_IDS.includes(id)));
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(false);

  useEffect(() => { store.set("yia-done", done); }, [done]);
  useEffect(() => {
    const onHash = () => { const h = location.hash.slice(1); if (valid(h)) setCur(h); };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  useEffect(() => {
    if (!open) return;
    const onKey = e => { if (e.key === "Escape") setOpen(false); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [open]);

  const go = id => { setCur(id); setOpen(false); try { history.replaceState(null, "", "#" + id); } catch (e) {} window.scrollTo(0, 0); };
  const toggleDone = id => setDone(d => d.includes(id) ? d.filter(x => x !== id) : [...d, id]);
  const markDone = id => setDone(d => d.includes(id) ? d : [...d, id]);
  const m = MODULES.find(x => x.id === cur);
  const sideProps = { cur, done, go, q, setQ };

  return html`<div className="min-h-full bg-white lg:grid lg:grid-cols-[300px_minmax(0,1fr)]">
    <aside className="side-sticky hidden overflow-y-auto border-r border-line bg-white px-5 py-7 lg:block">
      <${Sidebar} ...${sideProps} idSuffix="side" />
    </aside>

    ${open && html`<div className="fixed inset-0 z-40 lg:hidden">
      <div className="absolute inset-0 bg-ink/40 backdrop-blur-sm" onClick=${() => setOpen(false)}></div>
      <aside className="drawer absolute inset-y-0 left-0 w-[min(320px,88vw)] overflow-y-auto bg-white pb-10 pr-5 shadow-2xl">
        <${Sidebar} ...${sideProps} idSuffix="drawer" onClose=${() => setOpen(false)} />
      </aside>
    </div>`}

    <main className="gutter min-w-0 pb-20 pt-5 lg:pt-12">
      <div className="mb-6 flex items-center justify-between gap-3 lg:hidden">
        <button onClick=${() => go("home")} aria-label="Youth in AI Learning Hub: home" className="flex flex-col items-start gap-0.5">
          <img src=${WORDMARK} alt="Youth in AI" width="140" height="28" className="h-7 w-auto" />
          <span className="text-[10px] font-semibold uppercase tracking-[0.14em] text-slate-500">Learning Hub</span>
        </button>
        <button onClick=${() => setOpen(true)} aria-expanded=${open} className=${BTN.secondary + " px-4"}>
          <${I.Menu} size=${16} /> Modules</button>
      </div>
      ${cur === "home" && html`<${Home} done=${done} go=${go} />`}
      ${cur === "guide" && html`<${GuideView} />`}
      ${m && html`<${ModuleView} m=${m} done=${done} toggleDone=${toggleDone} markDone=${markDone} go=${go} />`}
    </main>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
